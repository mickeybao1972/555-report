<script>
(function(){
  var P = JSON.parse(document.getElementById('payload').textContent);
  var f = document.getElementById('f'), pw = document.getElementById('pw');
  var msg = document.getElementById('msg'), go = document.getElementById('go');
  var show = document.getElementById('show');
  show.addEventListener('change', function(){ pw.type = show.checked ? 'text' : 'password'; });

  function b64d(s){
    var bin = atob(s), n = bin.length, u = new Uint8Array(n);
    for (var i = 0; i < n; i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  function say(t, cls){ msg.className = 'msg ' + (cls || ''); msg.textContent = t; }

  if (!(window.crypto && window.crypto.subtle)) {
    say('当前浏览器不支持解密：请改用较新的 Chrome / Edge / Safari 打开本页。', 'err');
    go.disabled = true;
    return;
  }

  f.addEventListener('submit', async function(e){
    e.preventDefault();
    var p = pw.value;
    if (!p) { say('请输入口令。', 'err'); return; }
    go.disabled = true; say('正在解密…');
    try {
      var enc = new TextEncoder();
      var base = await crypto.subtle.importKey('raw', enc.encode(p), 'PBKDF2', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey(
        { name:'PBKDF2', salt: b64d(P.salt), iterations: P.iter, hash:'SHA-256' },
        base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
      var buf = await crypto.subtle.decrypt({ name:'AES-GCM', iv: b64d(P.iv) }, key, b64d(P.ct));
      var html = new TextDecoder('utf-8').decode(buf);
      say('已解开，正在载入…', 'ok');
      document.open(); document.write(html); document.close();
    } catch (err) {
      say('口令不对，或内容已损坏。请核对后重试。', 'err');
      go.disabled = false; pw.select();
    }
  });
})();
</script>
